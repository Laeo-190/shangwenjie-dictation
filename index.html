<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尚雯婕听写法 · 英语精听练习</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --line:#e7e9f2;
    --accent:#5b5bd6; --accent-dark:#4a4ac0;
    --text:#1f2333; --muted:#7a7f95;
    --ok-bg:#e5f6e8; --ok-text:#1c7f37;
    --bad-bg:#fdecec; --bad-text:#c62828;
    --warn-bg:#fff4e0; --warn-text:#b26a00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{text-align:center; margin:16px 0 24px;}
  header h1{font-size:28px; font-weight:800; letter-spacing:1px;}
  header .sub{color:var(--muted); font-size:14px; margin-top:4px;}
  header .sub b{color:var(--accent);}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(20,24,60,.05);
  }
  h2{font-size:17px; font-weight:700; margin-bottom:12px;}
  .hidden{display:none !important;}

  /* 提示步骤 */
  .steps{display:grid; gap:8px; font-size:14px; color:var(--muted);}
  .steps span::before{content:attr(data-n)" "; color:var(--accent); font-weight:800;}

  /* 文章列表 */
  .passage-list{display:grid; gap:10px;}
  .level-head{display:flex; align-items:center; gap:8px; margin:14px 0 2px;}
  .level-head:first-child{margin-top:0;}
  .level-count{font-size:12px; color:var(--muted);}
  .passage{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; cursor:pointer; transition:.15s;
  }
  .passage:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 14px rgba(91,91,214,.12);}
  .passage .meta{flex:1; min-width:0;}
  .passage .title{font-weight:700; font-size:15px;}
  .passage .tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .badge{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600;}
  .lvl-初级{background:#e5f6e8; color:#1c7f37;}
  .lvl-中级{background:#fff4e0; color:#b26a00;}
  .lvl-高级{background:#fdecec; color:#c62828;}
  .focus{background:#eef0fb; color:#4a4ac0;}
  .score-best{font-size:12px; color:var(--accent); font-weight:700; white-space:nowrap;}

  /* 自定义 */
  #custom-area{width:100%; min-height:110px; border:1px solid var(--line); border-radius:12px;
    padding:12px; font-size:14px; font-family:inherit; resize:vertical;}
  #custom-area:focus{outline:none; border-color:var(--accent);}

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; border-radius:12px;
    padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; transition:.15s;
    font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn-small{padding:7px 12px; font-size:13px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* 练习区 */
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .progress{flex:1; text-align:center; font-weight:700; color:var(--muted);}
  .progress b{color:var(--accent); font-size:18px;}
  .player{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:8px 0 14px;}
  .play-big{font-size:16px; padding:12px 22px;}
  .ctrl{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);}
  .ctrl select{border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px; font-family:inherit; background:#fff;}
  .playing{color:var(--accent); font-size:13px; font-weight:700; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.35;}}
  textarea#input{
    width:100%; min-height:90px; border:1px solid var(--line); border-radius:12px;
    padding:14px; font-size:16px; font-family:inherit; resize:vertical; line-height:1.7;
  }
  textarea#input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,91,214,.12);}
  .actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--muted); margin-top:10px;}

  /* 结果 */
  #result{margin-top:16px; border-top:1px dashed var(--line); padding-top:16px;}
  .score-banner{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .score-ring{
    width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; color:#fff; flex-shrink:0;
  }
  .score-msg{font-size:14px; color:var(--muted);}
  .answer-line{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .chip{
    display:inline-flex; flex-direction:column; align-items:center; border-radius:8px;
    padding:4px 9px; font-size:14px; line-height:1.3;
  }
  .chip b{font-weight:600;}
  .chip i{font-style:normal; font-size:11px; opacity:.8; margin-top:1px;}
  .chip .pos{color:var(--accent); font-weight:700; opacity:.95;}
  .chip.extra i{text-decoration:none;}
  .grammar-note{background:#fff7ed; border:1px solid #fde68a; border-radius:10px; padding:8px 12px; font-size:13px; color:#92400e; margin-top:4px;}
  .chip.ok{background:var(--ok-bg); color:var(--ok-text);}
  .chip.miss{background:var(--bad-bg); color:var(--bad-text);}
  .chip.extra{background:#f0f1f5; color:var(--muted); text-decoration:line-through;}
  .label-line{font-size:12px; color:var(--muted); margin-top:12px; font-weight:700;}
  .extra-line{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .nav{display:flex; gap:10px; margin-top:20px;}
  .nav .spacer{flex:1;}

  /* 成绩页 */
  .big-score{text-align:center; padding:10px 0;}
  .big-score .num{font-size:56px; font-weight:800; color:var(--accent); line-height:1;}
  .big-score .lbl{color:var(--muted); margin-top:6px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .stat{background:var(--bg); border-radius:12px; padding:12px; text-align:center;}
  .stat .v{font-size:20px; font-weight:800;}
  .stat .k{font-size:12px; color:var(--muted);}
  .per-sentence{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px;}
  .per-sentence:last-child{border-bottom:none;}
  .per-sentence .idx{color:var(--muted); width:26px; flex-shrink:0; font-weight:700;}
  .per-sentence .txt{flex:1; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .dot.g{background:#34a853;} .dot.r{background:#ea4335;} .dot.y{background:#fbbc04;}

  /* 复盘弹窗 */
  .overlay{position:fixed; inset:0; background:rgba(20,24,60,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px;}
  .recap-card{background:var(--card); border-radius:18px; max-width:600px; width:100%; max-height:84vh; overflow:auto; padding:22px; box-shadow:0 12px 40px rgba(20,24,60,.25);}
  .recap-head{display:flex; align-items:center; justify-content:space-between; font-size:18px; font-weight:800;}
  .recap-sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .recap-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:14px 0;}
  .recap-stat{background:var(--bg); border-radius:12px; padding:10px; text-align:center;}
  .recap-stat .v{font-size:20px; font-weight:800; color:var(--accent); line-height:1.2;}
  .recap-stat .k{font-size:11px; color:var(--muted); margin-top:2px;}
  .recap-words{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .recap-word{background:#eef0fb; border-radius:10px; padding:6px 10px; font-size:13px; line-height:1.5;}
  .recap-word b{color:var(--accent); font-size:14px;}
  .recap-word span{color:var(--text);}
  .recap-word i{font-style:normal; color:var(--muted); font-size:11px; display:block;}
  .recap-empty{color:var(--muted); font-size:14px; padding:6px 0;}
  .recap-tip{font-size:13px; color:var(--muted); margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎧 尚雯婕听写法</h1>
    <div class="sub">精听 · 听写 · 跟读 —— <b>一篇吃透，胜过十篇</b></div>
  </header>

  <!-- 首页 -->
  <section id="home">
    <div class="card">
      <h2>怎么练</h2>
      <div class="steps">
        <span data-n="1">点「播放本句」，听一句英语（语速、口音可调）</span>
        <span data-n="2">把你听到的写进输入框，听不清就反复重听</span>
        <span data-n="3">点「提交核对」，逐词对照，看自己错在哪</span>
        <span data-n="4">跟着原声大声朗读，直到能流利背诵再换下一句</span>
      </div>
    </div>

    <div class="card">
      <h2>选择一篇开始</h2>
      <div class="passage-list" id="passage-list"></div>
    </div>

    <div class="card">
      <h2>✍️ 自定义文本</h2>
      <p class="hint" style="margin:0 0 10px;">粘贴任意英文，点「开始」即可练习（也可用来练课文、演讲稿）</p>
      <textarea id="custom-area" placeholder="在这里粘贴英文文本…&#10;多个句子用句号分隔。"></textarea>
      <div class="actions" style="margin-top:12px;">
        <button class="btn btn-primary" id="custom-start">开始练习</button>
      </div>
    </div>
  </section>

  <!-- 练习页 -->
  <section id="practice" class="hidden">
    <div class="topbar">
      <button class="btn btn-ghost btn-small" id="back-btn">← 返回</button>
      <div class="progress">第 <b id="cur">1</b> / <span id="total">5</span> 句</div>
      <span class="badge focus" id="focus-tag"></span>
    </div>
    <div class="card">
      <h2 id="passage-title"></h2>
      <div class="player">
        <button class="btn btn-primary play-big" id="play-btn">🔊 播放本句</button>
        <span class="playing hidden" id="playing">正在播放…</span>
        <div class="ctrl">语速
          <select id="rate">
            <option value="0.5">0.5× 慢速</option>
            <option value="0.65">0.65×</option>
            <option value="0.8" selected>0.8×</option>
            <option value="1">1× 常速</option>
          </select>
        </div>
        <div class="ctrl">口音
          <select id="accent">
            <option value="en-US" selected>美音 🇺🇸</option>
            <option value="en-GB">英音 🇬🇧</option>
          </select>
        </div>
      </div>
      <textarea id="input" placeholder="听到什么就写什么…（按 Enter 提交核对）"></textarea>
      <div class="actions">
        <button class="btn btn-primary" id="check-btn">✅ 提交核对</button>
        <button class="btn btn-ghost" id="reveal-btn">👁 显示答案</button>
        <button class="btn btn-ghost" id="skip-btn">⏭ 跳过</button>
      </div>
      <div id="result" class="hidden"></div>
      <div class="nav">
        <button class="btn btn-ghost" id="prev-btn">← 上一句</button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="next-btn">下一句 →</button>
      </div>
    </div>
  </section>

  <!-- 成绩页 -->
  <section id="summary" class="hidden">
    <div class="card">
      <h2>🎉 练习完成</h2>
      <div class="big-score">
        <div class="num" id="sum-score">0%</div>
        <div class="lbl">总正确率</div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="v" id="sum-correct">0</div><div class="k">正确词数</div></div>
        <div class="stat"><div class="v" id="sum-total">0</div><div class="k">总词数</div></div>
      </div>
      <h2 style="margin-top:18px;">逐句成绩</h2>
      <div id="per-sentence"></div>
      <div class="actions" style="margin-top:18px;">
        <button class="btn btn-primary" id="retry-btn">🔄 再练一遍</button>
        <button class="btn btn-ghost" id="home-btn">返回列表</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay hidden" id="recap-overlay">
  <div class="recap-card">
    <div class="recap-head">
      <span>📝 今日复盘</span>
      <button class="btn btn-ghost btn-small" id="recap-close">✕ 关闭</button>
    </div>
    <p class="recap-sub">花 5 分钟回顾今天学到的</p>
    <div class="recap-stats" id="recap-stats"></div>
    <div class="label-line">今日错词 · 读 3 遍 + 遮中文回想</div>
    <div class="recap-words" id="recap-words"></div>
    <p class="recap-tip" id="recap-tip"></p>
  </div>
</div>

<script>
const PASSAGES = [
  {id:"p1", title:"我的早晨", level:"初级", focus:"日常口语",
   en:"I get up at seven every morning. First, I wash my face and brush my teeth. Then I eat a simple breakfast with my family. After that, I walk to the bus stop near my home. The bus is never late on sunny days.",
   zh:"我每天早上七点起床。先洗脸刷牙。然后和家人吃一顿简单的早餐。之后我走到家附近的公交站。晴天时公交车从不迟到。", grammar:["一般现在时 + 频率副词", "并列谓语 wash...and brush", "一般现在时 eat", "一般现在时 walk", "系表结构 be + 形容词"]},
  {id:"p2", title:"我的宠物", level:"初级", focus:"日常口语",
   en:"I have a small white cat. Her name is Snow. She sleeps on my bed at night. In the day, she likes to sit by the window. She makes me happy when I feel sad.",
   zh:"我有一只小白猫。她叫雪球。晚上她睡在我的床上。白天她喜欢坐在窗边。当我难过时，她会让我开心起来。", grammar:["一般现在时 have + 形容词", "系动词 be + 表语", "三单 sleeps + 时间状语", "不定式 to sit 作宾语", "使役 make + 宾补 + when 从句"]},
  {id:"p3", title:"周末计划", level:"初级", focus:"日常口语",
   en:"This weekend I want to stay home and rest. On Saturday I will cook a big lunch. On Sunday I plan to read a new book. Maybe I will call my old friend too. I hope the weather is nice for a short walk.",
   zh:"这个周末我想待在家里休息。周六我要做一顿丰盛的午餐。周日我打算读一本新书。也许我还会给老朋友打个电话。我希望天气好，可以出去走走。", grammar:["不定式 to stay 作宾语", "一般将来时 will cook", "不定式 to read", "一般将来时 will call", "宾语从句 hope"]},
  {id:"p4", title:"城市生活", level:"中级", focus:"连读",
   en:"Living in a big city has both good sides and bad sides. You can find a job easily and meet many interesting people. But the traffic is heavy, and the cost of living is high. Sometimes I wish I could live in a quiet town by the sea.",
   zh:"在大城市生活有好处也有坏处。你可以轻松找到工作，认识许多有趣的人。但交通拥堵，生活成本也高。有时我希望自己能住在海边安静的小镇。", grammar:["动名词作主语 Living", "情态动词 can + 并列", "并列句 and", "虚拟语气 wish + could"]},
  {id:"p5", title:"健康饮食", level:"中级", focus:"弱读",
   en:"Eating well is not as hard as many people think. You do not need to buy expensive food. Just add more fruit and vegetables to your meals. Drink enough water and eat less sugar. Small changes can make a big difference over time.",
   zh:"吃得好并不像很多人想的那么难。你不需要买昂贵的食物。只要在餐食里多加些水果和蔬菜。多喝水、少吃糖。小的改变日积月累会带来很大的不同。", grammar:["动名词主语 + as...as 同级比较", "否定 + 不定式 to buy", "祈使句", "祈使句 + 并列", "情态动词 can"]},
  {id:"p6", title:"一次难忘的旅行", level:"中级", focus:"数字与日期",
   en:"Last summer I took a trip to Yunnan with two friends. We left on the third of July and came back ten days later. The train tickets cost about two hundred yuan each. The mountains there were the most beautiful thing I have ever seen. I took over a thousand photos on that trip.",
   zh:"去年夏天我和两个朋友去云南旅行。我们七月三号出发，十天后回来。火车票每人约两百元。那里的山是我见过最美的风景。那次旅行我拍了一千多张照片。", grammar:["一般过去时 took", "一般过去时 left/came + 序数词", "一般过去时 cost", "最高级 + 现在完成时 have ever seen", "一般过去时 took + 数量"]},
  {id:"p7", title:"网上学习", level:"中级", focus:"比较与对比",
   en:"Learning online is different from learning in a classroom. Online courses are more flexible, so you can study at your own speed. But you may miss the support of a real teacher. In the classroom, it is easier to ask questions and make friends. Both ways have their own strengths and weaknesses.",
   zh:"网上学习和在教室里学习是不同的。网课更灵活，你可以按自己的节奏学。但你可能会失去真实老师的支持。在教室里，提问和交朋友更容易。两种方式各有优缺点。", grammar:["动名词主语 + be different from", "比较级 more flexible + so 结果", "情态动词 may", "形式主语 It is easier to", "both + 一般现在时"]},
  {id:"p8", title:"终身学习", level:"高级", focus:"学术词汇",
   en:"In a rapidly changing world, the ability to keep learning has become essential. People who stop acquiring new skills may find themselves left behind. Formal education gives us a foundation, but real growth often comes from curiosity and practice. Therefore, we should treat every challenge as a chance to improve.",
   zh:"在快速变化的世界里，持续学习的能力变得至关重要。停止获取新技能的人可能会发现自己落后了。正规教育为我们打下基础，但真正的成长往往来自好奇心和实践。因此，我们应把每一次挑战都当作提升的机会。", grammar:["现在完成时 has become + 不定式", "定语从句 who + 情态动词 may", "转折 but", "情态动词 should + 不定式 to improve"]},
  {id:"p9", title:"人工智能与未来", level:"高级", focus:"长句",
   en:"Artificial intelligence is changing the way we live and work at a surprising speed. Many simple jobs are now done by machines, which makes some people worry about the future. However, new technology has always created new kinds of work as well. The key is to keep an open mind and be ready to learn new things throughout our lives.",
   zh:"人工智能正以惊人的速度改变我们的生活和工作的方式。许多简单的工作现在由机器完成，这让一些人对未来感到担忧。然而，新技术也总是创造出新的工作类型。关键是保持开放的心态，并做好终身学习新事物的准备。", grammar:["现在进行时 is changing + 定语从句", "被动语态 are done + 非限制性定语从句 which", "现在完成时 has created", "不定式作表语 to keep"]},
  {id:"p10", title:"环境保护", level:"高级", focus:"商务表达",
   en:"Protecting the environment is no longer a choice but a responsibility for every company and every person. Reducing waste, saving energy, and using clean power are steps we can all take today. Governments should make clear rules, while businesses should follow them honestly. Only by working together can we leave a healthy planet to the next generation.",
   zh:"保护环境已不再是一种选择，而是每个企业和每个人的责任。减少浪费、节约能源、使用清洁能源，这些都是我们今天就能采取的行动。政府应当制定明确的规则，企业则应诚实地遵守。只有携手合作，我们才能给下一代留下一个健康的地球。", grammar:["动名词主语 + not...but", "动名词并列 + 定语从句", "情态动词 should + while 对比", "倒装 Only...can"]},
  {id:"p11", title:"我的学校", level:"初级", focus:"日常口语",
   en:"My school is not far from my home. I go there by bike every day. We have four classes in the morning. Our teachers are kind and helpful. After school, I often play basketball with my friends.",
   zh:"我的学校离我家不远。我每天骑自行车去上学。上午我们有四节课。我们的老师很和蔼、乐于助人。放学后，我经常和朋友们打篮球。", grammar:["系表 be + far from", "一般现在时 + 方式状语", "一般现在时 have", "be + 形容词", "频率 often"]},
  {id:"p12", title:"去购物", level:"初级", focus:"数字与日期",
   en:"On Friday, I went to the supermarket with my mother. We bought some bread, milk, and fruit. The store was very crowded that evening. We waited in line for about ten minutes. Finally, we walked home with two heavy bags.",
   zh:"周五我和妈妈去了超市。我们买了一些面包、牛奶和水果。那天晚上商店里很拥挤。我们排队等了大约十分钟。最后，我们拎着两个沉甸甸的袋子走回了家。", grammar:["一般过去时 went", "一般过去时 bought + 并列", "was + 形容词", "一般过去时 waited + for 时间段", "一般过去时 walked"]},
  {id:"p13", title:"天气", level:"初级", focus:"日常口语",
   en:"The weather changes a lot in spring. Some days are warm and sunny. Other days are cold and rainy. I always bring an umbrella with me. It is better to be ready than sorry.",
   zh:"春天的天气变化很大。有些日子温暖晴朗。另一些日子又冷又下雨。我总是随身带一把伞。有备无患总比后悔好。", grammar:["三单 changes", "be + 形容词", "be + 形容词", "频率 always", "形式主语 It is better to"]},
  {id:"p14", title:"我的房间", level:"初级", focus:"日常口语",
   en:"My room is small but clean. There is a bed near the window. On the desk, I keep my books and a small lamp. I like to read in my room at night. It is my favorite place in the house.",
   zh:"我的房间虽小但很干净。窗边有一张床。书桌上放着我的书和一盏小台灯。我喜欢晚上在房间里看书。这是家里我最喜欢的地方。", grammar:["转折 but + 形容词", "there be 句型", "一般现在时 keep", "不定式 to read", "形容词 favorite"]},
  {id:"p15", title:"喜欢的食物", level:"初级", focus:"日常口语",
   en:"I love noodles more than rice. My mother cooks them very well. She adds eggs, tomatoes, and green onions. The soup is hot and tasty. I can eat two bowls in one meal.",
   zh:"比起米饭，我更喜欢面条。我妈妈把它们煮得特别好吃。她会加鸡蛋、西红柿和葱花。汤又热又鲜美。我一顿饭能吃两碗。", grammar:["比较级 more than", "三单 cooks + 副词 well", "三单 adds + 并列", "be + 形容词", "情态动词 can"]},
  {id:"p16", title:"时间管理", level:"中级", focus:"比较与对比",
   en:"Good time management is the key to a balanced life. Some people plan every hour of their day. Others just do things when they remember them. The first way is more efficient, but it can feel too strict. The best method is to make a simple list and follow it with some freedom.",
   zh:"良好的时间管理是平衡生活的关键。有些人把一天中的每个小时都计划好。另一些人则是想起来才去做。第一种方式更高效，但可能感觉太死板。最好的方法是列一份简单的清单，并带着一定的自由度去执行。", grammar:["系表 be + 名词", "一般现在时 plan", "when 时间状语从句", "比较级 more efficient + but", "最高级 best + 不定式 to make"]},
  {id:"p17", title:"运动的好处", level:"中级", focus:"弱读",
   en:"Regular exercise brings many benefits to both body and mind. It makes your heart strong and your sleep better. It can also reduce stress after a long day. You do not need to go to a gym to stay active. A thirty-minute walk every day is a great start.",
   zh:"经常锻炼对身心都有许多好处。它能让你的心脏更强健、睡眠更好。漫长的一天过后，它还能减轻压力。你不需要去健身房就能保持活力。每天散步三十分钟就是一个很好的开始。", grammar:["三单 brings", "使役 make + 宾补", "情态动词 can", "不定式 to go/to stay", "一般现在时 is"]},
  {id:"p18", title:"友谊", level:"中级", focus:"日常口语",
   en:"A true friend is someone who stands by you in hard times. You do not need to talk every day to stay close. When you meet again, you can pick up right where you left off. Good friends accept you as you are. They also tell you the truth when you need to hear it.",
   zh:"真正的朋友是在困难时支持你的人。你们不需要每天聊天也能保持亲密。再次见面时，你们能像没分开过一样自然地接上话题。好朋友接纳真实的你。当你有必要听到真话时，他们也会直言相告。", grammar:["定语从句 who", "不定式 to talk/to stay", "when 从句 + 情态动词 can", "方式状语 as you are", "双宾语 tell you + when 从句"]},
  {id:"p19", title:"阅读的力量", level:"中级", focus:"学术词汇",
   en:"Reading is one of the cheapest and richest hobbies in the world. A good book can take you to another place in minutes. It also builds your vocabulary without any hard work. Many successful people read for at least half an hour every day. Start with what you enjoy, and the habit will grow.",
   zh:"阅读是世界上最便宜也最充实的爱好之一。一本好书几分钟就能把你带到另一个地方。它还能在不费力的情况下扩大你的词汇量。许多成功人士每天至少阅读半小时。从你喜欢的书开始，这个习惯就会慢慢养成。", grammar:["动名词主语 + 最高级", "情态动词 can", "三单 builds", "一般现在时 read + 时间", "祈使句 + 宾语从句 what"]},
  {id:"p20", title:"出行方式", level:"中级", focus:"数字与日期",
   en:"There are many ways to travel across the country. Taking a train is safe and not too expensive. A plane is much faster but costs more money. Driving a car gives you the most freedom. For short trips, I always choose the train because it is comfortable.",
   zh:"在全国各地旅行有很多种方式。坐火车既安全又不太贵。飞机快得多，但花费更高。自己开车最自由。短途出行我总是选火车，因为它很舒适。", grammar:["there be + 不定式 to travel", "动名词主语 Taking", "比较级 much faster + but", "动名词主语 + 最高级 most", "because 原因状语从句"]},
  {id:"p21", title:"睡眠", level:"中级", focus:"比较与对比",
   en:"Getting enough sleep is more important than many people realize. Adults need about seven or eight hours each night. Teenagers may need even more as their bodies grow. A quiet, dark room helps you fall asleep faster. So put your phone away an hour before bed.",
   zh:"获得充足的睡眠比很多人意识到的更重要。成年人每晚需要大约七到八小时。青少年由于身体在发育，可能需要更多。安静、黑暗的房间能帮你更快入睡。所以睡前一个小时把手机收起来吧。", grammar:["动名词主语 + 比较级 more than", "一般现在时 need", "情态动词 may + as 从句", "使役 help + 不定式 fall", "祈使句"]},
  {id:"p22", title:"爱好", level:"中级", focus:"日常口语",
   en:"Everyone needs a hobby to relax after work or study. Some people collect stamps or old coins. Others enjoy cooking, drawing, or playing music. A good hobby gives you joy and new skills at the same time. It does not have to cost much money to be fun.",
   zh:"每个人都需要一个爱好来在工作或学习之后放松。有些人收集邮票或旧硬币。另一些人则喜欢做饭、画画或演奏音乐。好的爱好能同时带给你快乐和新技能。它不一定非要花很多钱才会有趣。", grammar:["不定式 to relax", "一般现在时 collect", "动名词作宾语 enjoy doing", "双宾语 gives you", "不定式 to be fun"]},
  {id:"p23", title:"节约用水", level:"中级", focus:"商务表达",
   en:"Water is the most precious resource on our planet. Yet many of us waste it every day without thinking. We can save water by taking shorter showers and fixing leaky taps. Small habits like these add up over time. If everyone does a little, the world will be much better.",
   zh:"水是我们星球上最宝贵的资源。然而我们很多人每天想都不想就浪费它。我们可以通过缩短淋浴时间、修好漏水的水龙头来节水。像这样的小习惯日积月累就会见效。如果每个人都做一点，世界会美好得多。", grammar:["最高级 most precious", "转折 yet + 动名词 without thinking", "情态动词 can + by 动名词", "一般现在时 add up", "条件状语从句 if + will"]},
  {id:"p24", title:"全球化", level:"高级", focus:"学术词汇",
   en:"Globalization has connected the world in ways that were once impossible. Goods, ideas, and people now move across borders faster than ever before. This brings many opportunities, but it also creates new challenges. Local cultures must work hard to keep their own identity. The key is to share with others without losing who we are.",
   zh:"全球化以曾经无法想象的方式连接了世界。商品、思想和人员如今以空前的速度跨越国界流动。这带来了许多机遇，也带来了新的挑战。本土文化必须努力保持自己的认同。关键在于与他人分享，同时不丢失自我。", grammar:["现在完成时 has connected + 定语从句 that", "比较级 faster than", "转折 but", "情态动词 must + 不定式 to keep", "不定式作表语 + 宾语从句 who"]},
  {id:"p25", title:"社交媒体", level:"高级", focus:"长句",
   en:"Social media has changed the way we communicate with one another. On the one hand, it helps us stay in touch with friends who live far away. On the other hand, it can waste our time and harm our mental health. The challenge is to use it wisely and not let it control our lives. Setting a daily time limit is a simple but effective first step.",
   zh:"社交媒体改变了我们彼此交流的方式。一方面，它帮助我们与远方的朋友保持联系。另一方面，它可能浪费我们的时间、损害心理健康。挑战在于明智地使用它，不让它控制我们的生活。设定每日使用时长限制，是简单而有效的第一步。", grammar:["现在完成时 has changed + 定语从句", "help + 不定式 stay + 定语从句 who", "情态动词 can + 并列", "不定式作表语 + let 使役", "动名词主语 Setting"]},
  {id:"p26", title:"职业选择", level:"高级", focus:"商务表达",
   en:"Choosing a career is one of the most important decisions in life. Many people follow their parents' advice instead of their own interest. Money matters, but a job you hate will never bring true happiness. It is better to find work that fits your skills and values. Talk to people in the field before you make a final choice.",
   zh:"选择职业是人生中最重要的决定之一。许多人听从父母的建议，而不是自己的兴趣。钱固然重要，但一份你讨厌的工作永远不会带来真正的幸福。最好找一份符合你技能和价值观的工作。在做最终决定之前，先和该领域的人聊一聊。", grammar:["动名词主语 + 最高级", "一般现在时 follow + instead of", "定语从句 you hate + but", "形式主语 It is better + 定语从句 that", "祈使句 + before 从句"]},
  {id:"p27", title:"教育公平", level:"高级", focus:"学术词汇",
   en:"Education is the most powerful tool for reducing inequality in society. A good education gives every child a chance to build a better future. However, the quality of schools still varies widely from place to place. Governments should invest more in teachers and resources in poor areas. Only then can every student reach their full potential.",
   zh:"教育是减少社会不平等最有力的工具。良好的教育让每个孩子都有机会创造更美好的未来。然而，学校质量在不同地方仍然差异很大。政府应在贫困地区加大对教师和资源的投入。只有这样，每个学生才能充分发挥自己的潜力。", grammar:["最高级 + 动名词 for reducing", "不定式 to build", "转折 however + 三单 varies", "情态动词 should + 比较级 more", "倒装 Only then can"]},
  {id:"p28", title:"气候变化", level:"高级", focus:"长句",
   en:"Climate change is one of the greatest challenges facing our generation. Rising temperatures cause more extreme weather, such as floods and heat waves. Scientists agree that human activity is the main cause of this warming. We must act now before the damage becomes too hard to reverse. Every country and every person has a role to play in this effort.",
   zh:"气候变化是我们这一代人面临的最大挑战之一。气温上升导致更多极端天气，比如洪水和热浪。科学家一致认为，人类活动是这种变暖的主要原因。我们必须在破坏难以逆转之前现在就采取行动。每个国家和每个人都应在这场努力中发挥作用。", grammar:["最高级 greatest + 现在分词 facing", "现在分词 Rising + such as", "宾语从句 agree that", "情态动词 must + before 从句 + too...to", "不定式 to play"]},
  {id:"p29", title:"创业精神", level:"高级", focus:"商务表达",
   en:"Starting your own business takes courage, patience, and a clear plan. Many new companies fail within their first three years. Successful founders learn from their mistakes and keep going. They listen to customers and change their products when needed. Failure is not the opposite of success; it is often a step toward it.",
   zh:"创业需要勇气、耐心和清晰的计划。许多新公司在前三年内就会失败。成功的创始人从错误中学习并坚持下去。他们倾听客户意见，并在需要时改进产品。失败不是成功的反面；它往往是通往成功的一步。", grammar:["动名词主语 Starting + 并列", "一般现在时 fail + 时间状语", "并列 learn...and keep", "when + 过去分词 needed", "分号并列 + not...but"]},
  {id:"p30", title:"文化交流", level:"高级", focus:"学术词汇",
   en:"Cultural exchange helps people understand each other in a deep and lasting way. When we learn another language, we also learn a new way of thinking. Travel, food, music, and film all open windows to different worlds. Such experiences reduce fear and build trust between nations. In the end, we discover that we share more than we differ.",
   zh:"文化交流帮助人们以深刻而持久的方式理解彼此。当我们学习另一种语言时，我们也学会了新的思维方式。旅行、美食、音乐和电影都为不同的世界打开了一扇窗。这样的经历能减少恐惧、建立国家之间的信任。最终我们会发现，我们的共同点多于差异。", grammar:["help + 不定式 understand", "when 从句", "并列主语", "并列谓语 reduce...and build", "宾语从句 discover that + 比较级"]},
  {id:"p31", title:"财经新闻", level:"高级", focus:"商务表达",
   en:"The central bank announced yesterday that it would keep interest rates unchanged. Many economists had expected a small cut to support the slowing economy. However, officials warned that high prices would remain a concern for months. As a result, the stock market fell sharply in the afternoon. Investors are now waiting for clearer signals from the government. Analysts believe a change may not come until early next year.",
   zh:"中央银行昨天宣布将维持利率不变。许多经济学家此前预计会小幅降息以支撑放缓的经济。然而官员们警告，物价高企在未来数月仍会令人担忧。因此，股市在下午大幅下跌。投资者目前正在等待政府更明确的信号。分析师认为，调整可能要等到明年初才会出现。",
   grammar:["过去将来时 would keep + 宾语从句","过去完成时 had expected + 不定式 to support","宾语从句 warned that + 一般将来时 would remain","结果状语 as a result + 一般过去时 fell","现在进行时 are waiting","宾语从句 believe + may not come until"]},
  {id:"p32", title:"科技新闻", level:"高级", focus:"长句",
   en:"A leading technology company has released a new device that can translate speech in real time. The product, which costs less than three hundred dollars, is aimed at travelers and students. Users simply speak into the small device, and it repeats the sentence in another language. The company says the device has been tested in over forty countries. Experts believe this kind of technology will soon become a part of daily life. Some people, however, worry that it may reduce the need to learn foreign languages.",
   zh:"一家领先的科技公司发布了一款能实时翻译语音的新设备。这款售价不到三百美元的产品面向旅行者和学生。用户只需对着这个小设备说话，它就会用另一种语言复述这句话。该公司表示，这款设备已在四十多个国家进行过测试。专家认为，这类技术很快就会成为日常生活的一部分。不过也有人担心，它可能会降低学习外语的必要性。",
   grammar:["现在完成时 has released + 定语从句 that","非限制性定语从句 which costs + 被动语态 is aimed","并列句 and + 一般现在时 repeats","现在完成时被动 has been tested","宾语从句 believe + 一般将来时 will become","转折 however + 宾语从句 worry that + may reduce"]},
  {id:"p33", title:"社会新闻", level:"高级", focus:"数字与日期",
   en:"A new survey has found that young people are reading fewer books than their parents did at the same age. Researchers say social media and short videos have taken up most of their free time. Many young adults now spend more than three hours a day on their phones. The survey also shows that those who read for pleasure do better at school. Teachers are calling for schools to set aside quiet reading time every day. They argue that the habit of reading must be built early in life.",
   zh:"一项新调查发现，年轻人读的书比他们父母在同龄时读的要少。研究人员表示，社交媒体和短视频占据了他们大部分的空闲时间。许多年轻人现在每天花在手机上的时间超过三小时。调查还显示，那些为了乐趣而阅读的人在学业上表现更好。教师呼吁学校每天留出安静的阅读时间。他们认为，阅读习惯必须在人生早期养成。",
   grammar:["现在完成时 has found + 比较级 fewer than","宾语从句 say + 现在完成时 have taken up","比较级 more than + 时间表达","定语从句 those who read + 比较级 do better","现在进行时 are calling + 不定式 to set aside","宾语从句 argue that + 情态动词被动 must be built"]},
  {id:"p34", title:"环境新闻", level:"高级", focus:"学术词汇",
   en:"Scientists have warned that global temperatures are rising faster than previously thought. The latest report shows that the past five years were the hottest on record. Extreme weather events, such as floods and wildfires, have become more frequent worldwide. Governments are being urged to cut carbon emissions before it is too late. Several countries have already promised to reach zero emissions by the middle of this century. Experts say every small action counts, from saving energy to planting trees.",
   zh:"科学家警告说，全球气温上升的速度比之前认为的更快。最新报告显示，过去五年是有记录以来最热的。洪水和野火等极端天气事件在全球变得更加频繁。各国政府正被敦促在一切为时已晚之前削减碳排放。一些国家已经承诺在本世纪中叶实现净零排放。专家表示，从节约能源到植树，每一个小小的行动都很重要。",
   grammar:["现在完成时 have warned + 比较级 faster than","最高级 the hottest on record","现在完成时 have become + 比较级 more frequent","现在进行时被动 are being urged + 时间状语从句 before","现在完成时 have promised + 不定式 to reach","宾语从句 say + 动名词 from saving to planting"]},
  {id:"p35", title:"国际新闻", level:"高级", focus:"商务表达",
   en:"Leaders from more than thirty countries met in the capital this week to discuss trade. The talks focused on reducing taxes and opening new markets. After two days of debate, they reached an agreement on several key issues. The deal is expected to create thousands of new jobs over the next five years. Some groups, though, have expressed doubts about whether the goals can be achieved. Officials admit that much work remains to be done before the plan becomes reality.",
   zh:"来自三十多个国家的领导人本周在首都会面，讨论贸易问题。会谈的重点是降低税收和开拓新市场。经过两天的辩论，他们就几个关键问题达成了协议。预计该协议将在未来五年创造数千个新就业岗位。不过一些团体对目标能否实现表示怀疑。官员们承认，在计划成为现实之前，还有大量工作要做。",
   grammar:["不定式 to discuss + 目的状语","动名词 reducing/opening 作宾语","时间状语 after + 一般过去时 reached","被动语态 is expected + 不定式 to create","让步 though + 宾语从句 whether","宾语从句 admit that + 被动语态 remains to be done"]},
  {id:"p36", title:"旅行vlog", level:"高级", focus:"日常口语",
   en:"Hey everyone, welcome back to my channel. Today I am taking you to a small town by the sea that I have always wanted to visit. We got up before sunrise so that we could catch the first light on the water. The streets were so quiet that we could hear the waves from far away. I ordered a bowl of local noodles for breakfast, and it was absolutely delicious. If you ever come here, you have to try the seafood as well. That is it for today, and I will see you in the next video.",
   zh:"大家好，欢迎回到我的频道。今天我要带大家去一个我一直想去海边小镇。我们在日出前就起床了，为的是能赶上洒在水面上的第一缕阳光。街道安静得能听到远处传来的海浪声。我点了一碗当地面条当早餐，好吃极了。如果你以后来这里，也一定要尝尝海鲜。今天就到这里，我们下个视频见。",
   grammar:["问候语 welcome back","现在进行时 am taking + 定语从句 that I have always wanted","so that 目的状语从句 + 情态动词 could catch","so...that 结果状语从句 + 情态动词 could hear","一般过去时 ordered + 强调 absolutely","条件状语从句 if + have to","一般将来时 will see"]},
  {id:"p37", title:"做饭vlog", level:"高级", focus:"日常口语",
   en:"Welcome back to my kitchen. Tonight I am going to show you how to cook a simple but tasty dinner. First, heat some oil in a pan and add the chopped onions. While the onions are cooking, cut the vegetables into small pieces. Once everything is ready, pour in the sauce and stir for a few minutes. The dish is done when the vegetables become soft but still colorful. I hope you will try this recipe at home and let me know how it goes.",
   zh:"欢迎回到我的厨房。今晚我要教大家怎么做一顿简单又美味的晚餐。先往锅里倒点油，加入切好的洋葱。等洋葱炒着的时候，把蔬菜切成小块。所有东西都准备好后，倒入酱汁搅拌几分钟。当蔬菜变软但仍保持颜色时，这道菜就做好了。希望你在家试试这个食谱，然后告诉我做得怎么样。",
   grammar:["问候语 welcome back","be going to 表将来 + how to 不定式","祈使句 heat/add + 过去分词作定语 chopped","时间状语从句 while + 现在进行时 are cooking","时间状语从句 once + 祈使句 pour/stir","时间状语从句 when + 一般现在时 become","宾语从句 hope + 一般将来时 will try"]},
  {id:"p38", title:"一天生活vlog", level:"高级", focus:"日常口语",
   en:"Good morning, guys. It is six thirty, and I have just finished my morning run. After a quick shower, I am making myself a healthy breakfast before I start working. I usually work from home, which saves me two hours of commuting every day. Around noon, I take a short break to stretch my legs and grab a coffee. In the afternoon, I focus on the tasks that need the most attention. I try to stop working by seven so that I can relax with a good book.",
   zh:"早上好，各位。现在是六点半，我刚跑完晨跑。快速冲个澡后，我正在给自己做一顿健康早餐，然后开始工作。我通常在家工作，这每天帮我省下两小时的通勤时间。中午前后，我会短暂休息一下，活动活动腿，喝杯咖啡。下午，我专注于最需要精力处理的任务。我尽量七点前结束工作，这样就能读本好书放松一下。",
   grammar:["问候语 good morning","现在完成时 have just finished + 现在进行时 am making","时间状语从句 before + 一般现在时 start","非限制性定语从句 which saves + 动名词 commuting","不定式 to stretch + 并列动词 grab","定语从句 that need + 最高级 the most attention","so that 目的状语从句 + 情态动词 can relax"]},
  {id:"p39", title:"健身vlog", level:"高级", focus:"日常口语",
   en:"What is up, everyone. Today I want to talk about the workout that changed my life. When I first started exercising, I could barely run for five minutes without stopping. I kept showing up every single day, even when I felt too tired to move. Slowly, my body got stronger, and my mind became clearer than ever. Now I work out four times a week, and I have never felt better. Remember that progress takes time, so do not give up too soon.",
   zh:"大家好啊。今天我想聊聊改变了我人生的那套训练。刚开始锻炼时，我连不停歇地跑五分钟都很难。我坚持每天出现，哪怕累得动不了。慢慢地，我的身体变强壮了，头脑也比以往任何时候都清晰。现在我每周锻炼四次，感觉从来没有这么好过。记住，进步需要时间，所以别太早放弃。",
   grammar:["问候语 what is up","定语从句 that changed + 时间状语从句 when","情态动词 could barely + 动名词 without stopping","让步状语从句 even when + too...to 结构","比较级 stronger / clearer than ever","一般现在时 work out + 现在完成时 have never felt better","祈使句 remember + 宾语从句 + so 引导结果"]},
  {id:"p40", title:"学习vlog", level:"高级", focus:"日常口语",
   en:"Hi there, and welcome to a new study with me video. This week I have been preparing for an important exam that is coming up next month. I find that studying in short blocks works much better for me than studying all day. Every forty minutes, I take a five minute break to rest my eyes and drink some water. I also keep a notebook where I write down every word that I do not know. By the end of the day, I feel that I have learned something valuable.",
   zh:"大家好，欢迎来到新的「和我一起学习」视频。这周我一直在为下个月即将到来的一场重要考试做准备。我发现分小段时间学习比整天学习效果好得多。每四十分钟，我就休息五分钟，让眼睛放松、喝点水。我还准备了一个笔记本，把不认识的词都写下来。一天结束时，我觉得自己学到了有价值的东西。",
   grammar:["问候语 hi there","现在完成进行时 have been preparing + 定语从句 that is coming up","宾语从句 find that + 动名词 studying + 比较级 better than","频率表达 every forty minutes + 不定式 to rest","定语从句 where + 定语从句 that I do not know","时间状语 by the end of + 宾语从句 feel that + 现在完成时 have learned"]}
];

let voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en')); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

/* ---------- 状态 ---------- */
const state = { passage:null, sentences:[], idx:0, rate:0.8, accent:'en-US' };

/* ---------- 工具 ---------- */
function toWords(text){
  return (text.toLowerCase()
    .replace(/[’‘]/g,"'")
    .replace(/'/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .split(/\s+/)
    .filter(Boolean));
}
function splitSentences(text){
  const clean = text.replace(/\s+/g,' ').trim();
  return (clean.match(/[^.!?]+[.!?]+/g) || [clean]).map(s=>s.trim()).filter(Boolean);
}
function diff(correct, user){
  const m=correct.length, n=user.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j] = correct[i]===user[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m && j<n){
    if(correct[i]===user[j]){ ops.push({t:'ok',c:correct[i]}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ ops.push({t:'miss',c:correct[i]}); i++; }
    else{ ops.push({t:'extra',u:user[j]}); j++; }
  }
  while(i<m) ops.push({t:'miss',c:correct[i++]});
  while(j<n) ops.push({t:'extra',u:user[j++]});
  return ops;
}
function scoreOf(ops){ const ok=ops.filter(o=>o.t==='ok').length; return ok/ops.filter(o=>o.t==='ok'||o.t==='miss').length; }
function pct(x){ return Math.round(x*100); }

/* ---------- 本地进度 ---------- */
const KEY='swj-dictation-v1';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(){
  const p = loadProgress();
  if(!p[state.passage.id]) p[state.passage.id]={};
  const sent = state.sentences.map(s=>({score:s.score, checked:s.checked}));
  p[state.passage.id].sentences = sent;
  const checked = sent.filter(s=>s.checked);
  const best = p[state.passage.id].best || 0;
  const cur = checked.length ? pct(checked.reduce((a,s)=>a+(s.score||0),0)/checked.length) : 0;
  p[state.passage.id].best = Math.max(best, cur);
  p[state.passage.id].done = state.sentences.every(s=>s.checked);
  localStorage.setItem(KEY, JSON.stringify(p));
}
const MK='swj-mistakes-v1', DK='swj-daily-v1';
function loadMistakes(){ try{ return JSON.parse(localStorage.getItem(MK))||[]; }catch(e){ return []; } }
function saveMistakes(a){ localStorage.setItem(MK, JSON.stringify(a)); }
function loadDaily(){ try{ return JSON.parse(localStorage.getItem(DK))||{}; }catch(e){ return {}; } }
function saveDaily(d){ localStorage.setItem(DK, JSON.stringify(d)); }
function today(){ return new Date().toISOString().slice(0,10); }
function logCheck(s){
  const t = today();
  const ok = s.ops.filter(o=>o.t==='ok').length;
  const d = loadDaily();
  if(!d[t]) d[t] = {ok:0, total:0, passages:[]};
  d[t].ok += ok;
  d[t].total += s.ops.filter(o=>o.t==='ok'||o.t==='miss').length;
  if(!d[t].passages.includes(state.passage.title)) d[t].passages.push(state.passage.title);
  saveDaily(d);
  const log = loadMistakes();
  s.ops.forEach(o=>{
    if(o.t==='miss'){
      const k = t+'|'+o.c;
      if(!log.some(x=>x.k===k)) log.push({k, d:t, w:o.c, p:state.passage.title});
    }
  });
  saveMistakes(log);
}
function showRecap(){
  const t = today();
  const daily = loadDaily()[t] || {ok:0, total:0, passages:[]};
  const wrong = loadMistakes().filter(x=>x.d===t);
  const acc = daily.total ? Math.round(daily.ok/daily.total*100) : 0;
  $('recap-stats').innerHTML =
    '<div class="recap-stat"><div class="v">'+daily.passages.length+'</div><div class="k">今日完成篇数</div></div>'+
    '<div class="recap-stat"><div class="v">'+daily.total+'</div><div class="k">今日听写词数</div></div>'+
    '<div class="recap-stat"><div class="v">'+acc+'%</div><div class="k">今日正确率</div></div>'+
    '<div class="recap-stat"><div class="v">'+wrong.length+'</div><div class="k">今日错词</div></div>';
  $('recap-words').innerHTML = wrong.length
    ? wrong.map(x=>'<div class="recap-word"><b>'+x.w+'</b> <span>'+(gloss(x.w)||'')+'</span><i>来自：'+x.p+'</i></div>').join('')
    : '<div class="recap-empty">🎉 今天还没有错词，继续保持！</div>';
  $('recap-tip').textContent = wrong.length
    ? '💡 花 5 分钟：把每个词大声读 3 遍，再遮住中文回想释义，直到脱口而出。'
    : '💡 明天再来一篇，稳定积累～';
  $('recap-overlay').classList.remove('hidden');
}

/* ---------- 首页 ---------- */
function renderHome(){
  const list=$('passage-list'); list.innerHTML='';
  const prog = loadProgress();
  ['初级','中级','高级'].forEach(level=>{
    const items = PASSAGES.filter(p=>p.level===level);
    if(!items.length) return;
    const head = document.createElement('div');
    head.className = 'level-head';
    head.innerHTML = '<span class="badge lvl-'+level+'">'+level+'</span><span class="level-count">'+items.length+' 篇</span>';
    list.appendChild(head);
    items.forEach(p=>{
      const d=document.createElement('button');
      d.className='passage';
      const best = prog[p.id] && prog[p.id].best ? prog[p.id].best : null;
      const done = prog[p.id] && prog[p.id].done;
      d.innerHTML =
        '<div class="meta">'+
          '<div class="title">'+p.title+'</div>'+
          '<div class="tags">'+
            '<span class="badge focus">'+p.focus+'</span>'+
            '<span class="badge" style="background:#f0f1f5;color:#7a7f95">'+splitSentences(p.en).length+' 句</span>'+
          '</div>'+
        '</div>'+
        (best!==null ? '<span class="score-best">'+(done?'✅ 已完成 · ':'')+'最佳 '+best+'%</span>' : '');
      d.onclick=()=>startPassage(p.id);
      list.appendChild(d);
    });
  });
}

function startPassage(id){
  const p = PASSAGES.find(x=>x.id===id);
  state.passage = p;
  state.sentences = splitSentences(p.en).map((t,i)=>({text:t, user:'', checked:false, score:0, ops:null, grammar:(p.grammar&&p.grammar[i])||''}));
  state.idx = 0;
  showPractice();
}
function startCustom(){
  const txt = $('custom-area').value.trim();
  if(!txt){ alert('先粘贴一段英文文本吧～'); return; }
  state.passage = {id:'custom', title:'自定义文本', level:'自定义', focus:'自由练习', en:txt};
  state.sentences = splitSentences(txt).map(t=>({text:t, user:'', checked:false, score:0, ops:null, grammar:''}));
  if(!state.sentences.length){ alert('没有识别到句子，请用句号分隔。'); return; }
  state.idx = 0;
  showPractice();
}

/* ---------- 练习页 ---------- */
function showPractice(){
  homeEl.classList.add('hidden'); summaryEl.classList.add('hidden'); practiceEl.classList.remove('hidden');
  $('passage-title').textContent = state.passage.title;
  const f=$('focus-tag'); f.textContent = state.passage.focus==='自由练习' ? '自定义' : state.passage.focus;
  $('total').textContent = state.sentences.length;
  loadSentence();
}
function loadSentence(){
  $('cur').textContent = state.idx+1;
  const s = state.sentences[state.idx];
  inputEl.value = s.user || '';
  resultEl.classList.add('hidden'); resultEl.innerHTML='';
  $('reveal-btn').disabled = false;
  $('prev-btn').disabled = state.idx===0;
  $('next-btn').textContent = state.idx===state.sentences.length-1 ? '🏁 完成' : '下一句 →';
  updatePlaying(false);
}
function saveInput(){ state.sentences[state.idx].user = inputEl.value.trim(); }

function speak(){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音朗读，请用 Chrome / Edge 打开。'); return; }
  const s = state.sentences[state.idx].text;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(s);
  u.lang = state.accent; u.rate = parseFloat(state.rate);
  const v = voices.find(v=>v.lang.toLowerCase().startsWith(state.accent.toLowerCase())) || voices[0];
  if(v) u.voice = v;
  updatePlaying(true);
  u.onend = u.onerror = ()=>updatePlaying(false);
  speechSynthesis.speak(u);
}
function updatePlaying(on){ const el=$('playing'); el.classList.toggle('hidden', !on); }

function check(){
  saveInput();
  const s = state.sentences[state.idx];
  if(!s.user){ alert('先写点什么再核对吧～'); return; }
  const cWords=toWords(s.text), uWords=toWords(s.user);
  if(!cWords.length){ alert('这个句子没有可判分的单词。'); return; }
  s.ops = diff(cWords, uWords);
  s.score = scoreOf(s.ops);
  s.checked = true;
  logCheck(s);
  renderResult(s);
  saveProgress();
}
function gloss(w){
  w = (w||'').toLowerCase();
  if(DICT[w]) return DICT[w];
  const c = [];
  if(w.endsWith('ies')) c.push(w.slice(0,-3)+'y');
  if(w.endsWith('ied')) c.push(w.slice(0,-3)+'y');
  if(w.endsWith('ing')){ c.push(w.slice(0,-3), w.slice(0,-3)+'e', w.slice(0,-4)); }
  if(w.endsWith('ed')){ c.push(w.slice(0,-2), w.slice(0,-1), w.slice(0,-3)); }
  if(w.endsWith('es')) c.push(w.slice(0,-2));
  if(w.endsWith('s')) c.push(w.slice(0,-1));
  if(w.endsWith('er')){ c.push(w.slice(0,-2), w.slice(0,-1)); }
  if(w.endsWith('est')) c.push(w.slice(0,-3));
  for(const x of c){ if(DICT[x]) return DICT[x]; }
  return '';
}
function gline(w){
  const g = gloss(w);
  if(!g) return '';
  const sp = g.indexOf(' ');
  const html = sp === -1 ? g : '<span class="pos">'+g.slice(0,sp)+'</span>'+g.slice(sp);
  return '<i>'+html+'</i>';
}
function reveal(){
  const s = state.sentences[state.idx];
  resultEl.classList.remove('hidden');
  resultEl.innerHTML = '<div class="label-line">📖 参考答案（跟读模仿）</div>'+
    '<div class="answer-line">'+toWords(s.text).map(w=>'<span class="chip ok"><b>'+w+'</b>'+gline(w)+'</span>').join('')+'</div>'+
    '<div class="score-msg" style="margin-top:8px;">🔊 点「播放本句」跟着大声朗读，模仿语音语调。</div>';
}

function wordChip(op){
  const w = op.t==='extra' ? op.u : op.c;
  const g = gline(w);
  if(op.t==='ok') return '<span class="chip ok"><b>'+op.c+'</b>'+g+'</span>';
  if(op.t==='miss'){
    let sub = '漏写';
    if(op.wrong){
      const wg = gloss(op.wrong);
      sub = '你写: '+op.wrong + (wg ? ' · '+wg : '');
    }
    return '<span class="chip miss"><b>'+op.c+'</b>'+g+'<i>'+sub+'</i></span>';
  }
  return '<span class="chip extra"><b>'+op.u+'</b>'+g+'</span>';
}
function renderResult(s){
  const score = pct(s.score);
  resultEl.classList.remove('hidden');
  let html = '<div class="score-banner">'+
    '<div class="score-ring" style="background:'+(score>=90?'#34a853':score>=60?'#fbbc04':'#ea4335')+'">'+score+'%</div>'+
    '<div class="score-msg">'+(score===100?'💯 完美！全对，继续跟读巩固。':score>=90?'👏 很棒！再跟读几遍就熟了。':score>=60?'🔁 有错很正常，看下红词错在哪，重听重写。':'💪 这句子有点难，多听几遍，对照答案再写一次。')+'</div>'+
  '</div>';

  // 参考答案行：按顺序着色，miss 与紧跟的 extra 配对显示
  const ops = s.ops, extras=[];
  const line=[];
  let i=0;
  while(i<ops.length){
    const op=ops[i];
    if(op.t==='ok'){ line.push(wordChip(op)); i++; }
    else if(op.t==='miss'){
      let wrong=null;
      if(ops[i+1] && ops[i+1].t==='extra'){ wrong=ops[i+1].u; i++; }
      line.push(wordChip({t:'miss',c:op.c,wrong})); i++;
    } else { extras.push(op.u); i++; }
  }
  html += '<div class="label-line">✅ 参考答案</div><div class="answer-line">'+line.join('')+'</div>';
  if(extras.length) html += '<div class="label-line">➕ 多余词（你多写的）</div><div class="extra-line">'+extras.map(w=>wordChip({t:'extra', u:w})).join('')+'</div>';
  if(state.passage.zh) html += '<div class="label-line">🌐 中文翻译</div><div class="score-msg" style="color:var(--text);">'+state.passage.zh+'</div>';
  if(s.grammar) html += '<div class="label-line">📐 语法</div><div class="grammar-note">'+s.grammar+'</div>';
  resultEl.innerHTML = html;
}

function go(delta){
  saveInput();
  const next = state.idx+delta;
  if(next<0 || next>=state.sentences.length){
    if(next>=state.sentences.length) finish();
    return;
  }
  state.idx = next;
  loadSentence();
}
function finish(){
  saveInput(); saveProgress();
  showSummary();
  showRecap();
}

/* ---------- 成绩页 ---------- */
function showSummary(){
  practiceEl.classList.add('hidden'); homeEl.classList.add('hidden'); summaryEl.classList.remove('hidden');
  const checked = state.sentences.filter(s=>s.checked);
  const okWords = checked.reduce((a,s)=>a+s.ops.filter(o=>o.t==='ok').length,0);
  const totWords = checked.reduce((a,s)=>a+s.ops.filter(o=>o.t==='ok'||o.t==='miss').length,0);
  const overall = totWords ? pct(okWords/totWords) : 0;
  $('sum-score').textContent = overall+'%';
  $('sum-correct').textContent = okWords;
  $('sum-total').textContent = totWords;
  const per=$('per-sentence'); per.innerHTML='';
  state.sentences.forEach((s,idx)=>{
    const d=document.createElement('div'); d.className='per-sentence';
    const dot = !s.checked ? 'y' : (s.score>=0.9 ? 'g' : 'r');
    d.innerHTML = '<span class="idx">'+(idx+1)+'</span>'+
      '<span class="txt">'+s.text+'</span>'+
      '<span class="dot '+dot+'"></span>'+
      (s.checked ? '<span style="font-weight:700;color:var(--muted);width:44px;text-align:right;">'+pct(s.score)+'%</span>' : '<span style="color:var(--muted);font-size:12px;">未做</span>');
    d.onclick=()=>{ state.idx=idx; showPractice(); };
    d.style.cursor='pointer';
    per.appendChild(d);
  });
}

/* ---------- 事件绑定 ---------- */
$('play-btn').onclick = speak;
$('check-btn').onclick = check;
$('reveal-btn').onclick = reveal;
$('skip-btn').onclick = ()=>{ const s=state.sentences[state.idx]; s.checked=false; go(1); };
$('prev-btn').onclick = ()=>go(-1);
$('next-btn').onclick = ()=>go(1);
$('back-btn').onclick = ()=>{ saveInput(); homeEl.classList.remove('hidden'); practiceEl.classList.add('hidden'); summaryEl.classList.add('hidden'); renderHome(); };
function restart(){
  state.sentences = splitSentences(state.passage.en).map((t,i)=>({text:t, user:'', checked:false, score:0, ops:null, grammar:(state.passage.grammar&&state.passage.grammar[i])||''}));
  state.idx = 0;
  showPractice();
}
$('retry-btn').onclick = restart;
$('home-btn').onclick = ()=>{ summaryEl.classList.add('hidden'); homeEl.classList.remove('hidden'); renderHome(); };
$('custom-start').onclick = startCustom;
$('rate').onchange = e=>state.rate=e.target.value;
$('accent').onchange = e=>state.accent=e.target.value;
inputEl.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); check(); }
});

$('recap-close').onclick = ()=>$('recap-overlay').classList.add('hidden');
$('recap-overlay').addEventListener('click', e=>{ if(e.target.id==='recap-overlay') e.target.classList.add('hidden'); });

renderHome();
</script>
</body>
